services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    restart: unless-stopped
    ports:
      - "${PLANKA_PORT:-3000}:1337"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-planka}:${POSTGRES_PASSWORD:-planka}@db/${POSTGRES_DB:-planka}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_ADMIN_EMAIL=${ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${ADMIN_NAME:-Admin}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - planka-data:/app/public/user-avatars
      - planka-data:/app/public/project-background-images
      - planka-data:/app/private/attachments

  db:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-planka}
      - POSTGRES_USER=${POSTGRES_USER:-planka}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-planka}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planka}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  planka-data:
  db-data:
